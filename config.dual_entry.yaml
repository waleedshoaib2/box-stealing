# Dual entry — person takes a parcel out, then comes back for another

detector:
  mode: yolo_world
  device: ""
  conf: 0.25
  iou: 0.45
  imgsz: 640

  yolo_world:
    weights: yolov8s-worldv2.pt
    prompts:
      person:
        - person
      box:
        - cardboard box
        - box
        - package
        - parcel

tracker:
  iou_threshold: 0.3
  max_missed: 20

rules:
  enabled: false

opening:
  enabled: false

dual_entry:
  enabled: true
  hold_score_threshold: 0.50
  min_hold_frames: 10
  min_present_frames: 8
  exit_confirm_frames: 45
  exit_confirm_seconds: 1.5
  reentry_window_seconds: 180
  event_cooldown_frames: 180

alerts:
  enabled: true
  snapshot: true
  sound: true
  desktop: true
  cooldown_seconds: 8
  webhook_url: ""

recorder:
  enabled: true
  event_clips: true
  preroll_seconds: 6
  postroll_seconds: 8
  continuous: false
  segment_seconds: 300
  max_segments: 24
  annotated: true

visualizer:
  show: true
  write: false
  output_dir: outputs
  draw_scores: true
  trail_length: 20
  window_name: dual-entry

source:
  path: rtsp://USER:PASS@CAMERA_IP:554/Streaming/Channels/101/
  stride: 1
  rtsp_transport: tcp
  reconnect: true
  reconnect_delay: 1.0
