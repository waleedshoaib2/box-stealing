# Person putting a box into a bag — detection + rule engine

detector:
  # yolo_world: open-vocab person/box/bag (no custom weights needed)
  # custom: one YOLO model whose classes map to person/box/bag
  # dual: COCO (or any) person model + a separate box/bag model
  mode: yolo_world

  device: ""          # "" = auto (cuda if available, else cpu)
  conf: 0.25
  iou: 0.45
  imgsz: 640

  yolo_world:
    weights: yolov8s-worldv2.pt
    # Prompts sent to YOLO-World. Canonical labels are person / box / bag.
    prompts:
      person:
        - person
      box:
        - cardboard box
        - box
        - parcel
      bag:
        - shopping bag
        - bag
        - backpack
        - handbag
        - plastic bag
      open_box:
        - open cardboard box
        - open box

  custom:
    weights: models/person_box_bag.pt
    class_map:
      0: person
      1: box
      2: bag

  dual:
    person:
      weights: yolov8n.pt
      class_ids: [0]          # COCO person
    objects:
      weights: models/box_bag.pt
      class_map:
        0: box
        1: bag

tracker:
  iou_threshold: 0.3
  max_missed: 20              # frames a track can disappear before it is dropped

rules:
  enabled: true               # put-box-in-bag
  # Person is carrying a box
  hold_score_threshold: 0.50
  min_hold_frames: 8

  # Person is close enough to a bag to insert into it
  near_bag_score_threshold: 0.40
  min_near_bag_frames: 5

  # Box is entering / inside the bag (containment = intersection / box_area)
  insert_score_threshold: 0.45
  outside_containment: 0.20   # box must have been this "outside" the bag first
  min_insert_frames: 6

  # After an event, ignore repeats for this person
  event_cooldown_frames: 60

opening:
  enabled: false              # person opening a box — use config.open.yaml / --task open
  interact_score_threshold: 0.45
  min_interact_frames: 8
  height_growth_threshold: 0.20   # box must grow 20% vs closed baseline
  min_open_frames: 5
  event_cooldown_frames: 60

dual_entry:
  enabled: false              # take a parcel, leave, come back for another — config.dual_entry.yaml
  hold_score_threshold: 0.50
  min_hold_frames: 10
  interact_score_threshold: 0.45
  min_interact_frames: 8
  min_present_frames: 8
  exit_confirm_frames: 45     # person must be gone this long to count as left
  exit_confirm_seconds: 1.5   # extra: ignore brief detector dropouts
  reentry_window_seconds: 180
  event_cooldown_frames: 180

alerts:
  enabled: true
  snapshot: true              # save annotated JPEG under outputs/alerts/
  sound: true                 # play Sosumi (macOS)
  desktop: true               # macOS Notification Center popup
  cooldown_seconds: 8         # extra debounce on top of the rule-engine cooldown
  webhook_url: ""             # Slack / Discord / n8n incoming webhook (optional)

recorder:
  enabled: true
  event_clips: true           # save a clip around each put-box-in-bag event
  preroll_seconds: 6          # seconds kept in memory before the event
  postroll_seconds: 8         # seconds kept recording after the event
  continuous: false           # auto-record rotating files (REC button still works either way)
  segment_seconds: 300        # 5-minute continuous files
  max_segments: 24            # keep ~2 hours; 0 = unlimited
  annotated: true             # record overlay (boxes / state), not raw camera

visualizer:
  show: true
  write: false                # session-long mp4; recorder handles video instead
  output_dir: outputs
  draw_scores: true
  trail_length: 20
  window_name: put-box-in-bag

roi:
  enabled: false
  xyxy: []                    # normalized [x1, y1, x2, y2] 0-1; draw in the app
  classes:                    # detections kept only if they fall in the ROI
    - person
    - box
    - bag
    - open_box

source:
  path: rtsp://USER:PASS@CAMERA_IP:554/Streaming/Channels/101/
  stride: 1
  rtsp_transport: tcp         # tcp is more reliable than udp on LAN cameras
  reconnect: true
  reconnect_delay: 1.0        # seconds to wait before reopening a dropped RTSP stream
